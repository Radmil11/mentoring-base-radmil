<h1 style="padding-left: 450px">CREATE USER FORM</h1>
<div style="margin: 0px 30px 30px 30px">
  <form class="form-input" [formGroup]="form" (ngSubmit)="submitForm()">
    <p>NAME:</p>
    <input type="text" class="form-input" formControlName="name" />
    <div
      *ngIf="form.controls['name'].invalid && (form.controls['name'].dirty || form.controls['name'].touched)"
      class="alert"
    >
      <div *ngIf="form.controls['name'].errors">ИМЯ ВВЕДЕНО НЕПРАВИЛЬНО</div>
    </div>
    <p>EMAIL:</p>
    <input type="text" class="form-input" formControlName="email" />
    <div
      *ngIf="form.controls['email'].invalid && (form.controls['name'].dirty || form.controls['name'].touched)"
      class="alert"
    >
      <div *ngIf="form.controls['email'].errors">EMAIL ВВЕДЕН НЕВЕРНО</div>
    </div>
    <p>WEBSITE:</p>
    <input type="text" class="form-input" formControlName="website" />
    <div
      *ngIf="form.controls['website'].invalid && (form.controls['website'].dirty || form.controls['website'].touched)"
      class="alert"
    >
      <div *ngIf="form.controls['website'].errors">
        ВЕБСАЙТ ВВЕДЕН НЕПРАВИЛЬНО
      </div>
    </div>
    <p>COMPANY NAME:</p>
    <input type="text" class="form-input" formControlName="companyName" />
    <div
      *ngIf="form.controls['companyName'].invalid && (form.controls['companyName'].dirty || form.controls['companyName'].touched)"
      class="alert"
    >
      <div *ngIf="form.controls['companyName'].errors">
        КОМПАНИЯ ВВЕДЕНА НЕПРАВИЛЬНО
      </div>
    </div>
    <button class="button" [disabled]="form.invalid" type="submit">
      CREATE USER
    </button>
  </form>
</div>
