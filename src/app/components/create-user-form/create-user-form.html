<h1 class="userhead">CREATE USER FORM</h1>
  <form class="formgroup" [formGroup]="form" (ngSubmit)="submitForm()">

  <mat-form-field>
      <mat-label>phone:</mat-label>
      <input matInput formControlName="phone">
      <mat-error>телефон введен неправильно</mat-error>
  </mat-form-field>

    <mat-form-field>
      <mat-label>NAME:</mat-label>
      <input matInput formControlName="name">
      <mat-error>имя введено неправильно</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>EMAIL:</mat-label>
      <input matInput formControlName="email">
      <mat-error>email введен неправильно</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>WEBSITE:</mat-label>
      <input matInput formControlName="website"/>
      <mat-error>website введен неправильно</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>COMPANY NAME:</mat-label>
      <input matInput formControlName="companyName">
      <mat-error>companyName введен неправильно</mat-error>
    </mat-form-field>

    <button mat-fab extended class="button" [disabled]="form.invalid" type="submit">
      CREATE USER
    </button>
  </form>
