<div class="userslist">
  <p>{{ user.phone | removeDashes }}</p>
  <p>{{ user.name | customUpperCase }}</p>
  <p>{{ user.email | customUpperCase  }}</p>
  <p>{{ user.website | customUpperCase  }}</p>
  <p>{{ user.company.name | customUpperCase  }}</p>
  <button  (click)="openDeleteDialog()" class="buton">Удалить юзера</button>
  <button  (click)="openDialog()" class="buton">Редактировать юзера</button>
</div>
