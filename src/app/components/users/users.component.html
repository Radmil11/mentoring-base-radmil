<app-create-user-form (createUser)="createUser($event)"></app-create-user-form>
<div class="positionboxes">
  <div *ngFor="let user of usersService.users$ | async" class="userslist">
    <app-user-card
      [user]="user"
      (deleteUser)="deleteUser($event)"
    ></app-user-card>
  </div>
</div>
